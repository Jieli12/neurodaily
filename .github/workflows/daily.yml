name: NeuroDaily
on:
  schedule:
    - cron: "30 23 * * *"   # UTC 23:30 = 北京时间每天 07:30
  workflow_dispatch:        # 允许在网页上手动点“Run”
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python neurodaily.py --out docs
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          PAGE_URL: ${{ vars.PAGE_URL }}
      - run: |
          git config user.name "neurodaily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "daily $(date +%F)" || echo "no changes"
          git push
